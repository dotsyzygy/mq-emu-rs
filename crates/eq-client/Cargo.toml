[package]
name = "eq-client"
description = "Unofficial hooks into the EverQuest RoF2 emu client (32-bit), independent of MacroQuest: the shared eqclient.dll's ABI, its loader, and what it hooks. Not for live EverQuest."
keywords = ["everquest", "emu", "rof2", "hooks"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
default-target = "i686-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]

# The game client is the target's (32-bit is RoF2), so none needs naming.
# A client's feature is optional: it insists on that client, for a plugin that
# only supports it.
[features]
# EverQuest RoF2 emu client, 32-bit (i686-pc-windows-msvc).
rof2 = []
