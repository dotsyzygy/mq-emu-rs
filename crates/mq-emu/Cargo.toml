[package]
name = "mq-emu"
description = "Unofficial safe Rust API for writing MacroQuest emu (RoF2, 32-bit) plugins. Not affiliated with the MacroQuest project; not for live EverQuest."
keywords = ["macroquest", "everquest", "emu", "rof2", "plugin"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
default-target = "i686-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]

# The game client is MacroQuest's (the build in MQ_ROOT), so none needs naming.
# A client's feature is optional: it insists on that client, for a plugin that
# only supports it.
[features]
# EverQuest RoF2 emu client, 32-bit (i686-pc-windows-msvc).
rof2 = ["mq-emu-sys/rof2", "eq-client/rof2"]

[dependencies]
eq-client.workspace = true
mq-emu-sys.workspace = true

[dev-dependencies]
# Test-only C++ protobuf oracle for the Lua message format (path-only, so it's
# dropped when mq-emu is published).
lua-proto-oracle = { path = "../../tools/lua-proto-oracle" }
object = { version = "0.36", default-features = false, features = ["std", "read_core", "pe"] }

[[example]]
name = "minimal_plugin"
crate-type = ["cdylib"]
